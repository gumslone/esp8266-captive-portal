<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangman</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;text-align:center;padding:16px}
h1{font-size:22px;margin:8px 0}#w{font-size:30px;letter-spacing:8px;margin:14px 0;font-weight:700}
#k{max-width:340px;margin:8px auto}#k button{width:34px;height:40px;margin:3px;border:0;border-radius:6px;background:#334155;color:#fff;font-size:17px}
#k button:disabled{opacity:.3}#s{min-height:24px;margin:8px}#l{font-size:22px;letter-spacing:4px;color:#f87171}
.c button{padding:8px 14px;margin:4px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}a{color:#94a3b8}</style></head><body>
<h1>Hangman</h1><div class="c"><button onclick="start()">New word</button></div>
<div id="l"></div><div id="w"></div><div id="s"></div><div id="k"></div><a href="/">&larr; back</a>
<script>
var WORDS=['GARDEN','ROCKET','PLANET','ORANGE','PUZZLE','WINDOW','CASTLE','BRIDGE','DRAGON','JUNGLE','SUMMER','PENCIL',
 'GUITAR','RABBIT','SILVER','TURTLE','CANDLE','FOREST','WIZARD','ISLAND','PIRATE','MONKEY','BUTTER','ROBOT'];
var word,got,bad,MAX=6;
function start(){word=WORDS[Math.floor(Math.random()*WORDS.length)];got=[];bad=0;
 var h='';for(var i=65;i<91;i++){var c=String.fromCharCode(i);h+='<button id="k'+c+'" onclick="guess(\''+c+'\')">'+c+'</button>';}
 document.getElementById('k').innerHTML=h;draw();}
function shown(){return word.split('').map(function(c){return got.indexOf(c)>=0?c:'_';}).join('');}
function draw(){document.getElementById('w').textContent=shown();
 document.getElementById('l').textContent=new Array(bad+1).join('✖')+new Array(MAX-bad+1).join('○');
 var s=shown()==word?'You got it!':bad>=MAX?'Out of tries - it was '+word:'Wrong guesses left: '+(MAX-bad);
 document.getElementById('s').textContent=s;
 if(shown()==word||bad>=MAX)[].forEach.call(document.querySelectorAll('#k button'),function(b){b.disabled=true;});}
function guess(c){if(shown()==word||bad>=MAX)return;document.getElementById('k'+c).disabled=true;
 if(word.indexOf(c)>=0)got.push(c);else bad++;draw();}
start();
</script></body></html>
