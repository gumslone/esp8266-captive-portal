<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>15 Puzzle</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;text-align:center;padding:16px}
h1{font-size:22px;margin:8px 0}#b{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:300px;margin:12px auto}
#b button{aspect-ratio:1;font-size:28px;font-weight:700;border:0;border-radius:10px;background:#2563eb;color:#fff}
#b button.e{background:transparent}#s{min-height:24px;margin:8px}
.c button{padding:8px 14px;margin:4px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}a{color:#94a3b8}</style></head><body>
<h1>15 Puzzle</h1><div class="c"><button onclick="start()">Shuffle</button></div>
<div id="s"></div><div id="b"></div><a href="/">&larr; back</a>
<script>
var g,moves;
function adj(i,j){return (Math.abs(i-j)==1&&Math.floor(i/4)==Math.floor(j/4))||Math.abs(i-j)==4;}
function start(){g=[];for(var i=1;i<16;i++)g.push(i);g.push(0);moves=0;
 for(var k=0;k<300;k++){var e=g.indexOf(0),n=[];for(var j=0;j<16;j++)if(adj(e,j))n.push(j);
  var p=n[Math.floor(Math.random()*n.length)];g[e]=g[p];g[p]=0;}   // random legal moves = always solvable
 draw();}
function solved(){for(var i=0;i<15;i++)if(g[i]!=i+1)return false;return true;}
function draw(){var h='';for(var i=0;i<16;i++)h+='<button class="'+(g[i]?'':'e')+'" onclick="tap('+i+')">'+(g[i]||'')+'</button>';
 document.getElementById('b').innerHTML=h;document.getElementById('s').textContent=solved()&&moves?'Solved in '+moves+' moves!':'Moves: '+moves;}
function tap(i){var e=g.indexOf(0);if(!adj(i,e)||solved()&&moves)return;g[e]=g[i];g[i]=0;moves++;draw();}
start();
</script></body></html>
