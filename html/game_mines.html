<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;text-align:center;padding:16px}
h1{font-size:22px;margin:8px 0}#b{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;max-width:330px;margin:12px auto}
#b button{aspect-ratio:1;border:0;border-radius:5px;background:#334155;color:#fff;font-size:16px;font-weight:700;padding:0}
#b button.r{background:#1e293b}#b button.x{background:#b91c1c}#s{min-height:24px;margin:8px}
.c button{padding:8px 14px;margin:4px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}.c button.on{background:#f59e0b}a{color:#94a3b8}</style></head><body>
<h1>Minesweeper</h1><div class="c"><button onclick="start()">New game</button><button id="fm" onclick="flagMode()">&#9873; Flag mode</button></div>
<div id="s"></div><div id="b"></div><a href="/">&larr; back</a>
<script>
var W=9,M=10,mine,rev,flag,first,over,fm=false,COL=['','#60a5fa','#4ade80','#f87171','#c084fc','#fb923c','#22d3ee','#fff','#94a3b8'];
function nb(i){var r=Math.floor(i/W),c=i%W,o=[];for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++){var y=r+a,x=c+b;
 if((a||b)&&y>=0&&y<W&&x>=0&&x<W)o.push(y*W+x);}return o;}
function cnt(i){return nb(i).filter(function(j){return mine[j];}).length;}
function start(){mine=[];rev=[];flag=[];for(var i=0;i<W*W;i++){mine.push(false);rev.push(false);flag.push(false);}first=true;over=false;draw();msg(M+' mines');}
function lay(safe){var n=0;while(n<M){var i=Math.floor(Math.random()*W*W);if(!mine[i]&&i!=safe&&nb(safe).indexOf(i)<0){mine[i]=true;n++;}}}
function msg(m){document.getElementById('s').textContent=m;}
function flagMode(){fm=!fm;document.getElementById('fm').className=fm?'on':'';}
function draw(){var h='';for(var i=0;i<W*W;i++){var t='',k='';
 if(rev[i]){k='r';if(mine[i]){t='&#128163;';k='x';}else{var n=cnt(i);t=n?'<span style="color:'+COL[n]+'">'+n+'</span>':'';}}
 else if(flag[i])t='&#9873;';else if(over&&mine[i])t='&#128163;';
 h+='<button class="'+k+'" onclick="tap('+i+')" oncontextmenu="mark('+i+');return false">'+t+'</button>';}
 document.getElementById('b').innerHTML=h;}
function mark(i){if(over||rev[i])return;flag[i]=!flag[i];draw();}
function open(i){if(rev[i]||flag[i])return;rev[i]=true;if(!mine[i]&&!cnt(i))nb(i).forEach(open);}
function tap(i){if(over)return;if(fm){mark(i);return;}if(flag[i]||rev[i])return;if(first){lay(i);first=false;}
 if(mine[i]){rev[i]=true;over=true;draw();msg('Boom! Game over');return;}open(i);
 var left=0;for(var j=0;j<W*W;j++)if(!rev[j]&&!mine[j])left++;
 if(!left){over=true;draw();msg('You win!');return;}draw();}
start();
</script></body></html>
