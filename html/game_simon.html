<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Simon</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;text-align:center;padding:16px}
h1{font-size:22px;margin:8px 0}#b{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:280px;margin:12px auto}
#b button{aspect-ratio:1;border:0;border-radius:16px;opacity:.45}#b button.on{opacity:1}
#s{min-height:24px;margin:8px}.c button{padding:8px 14px;margin:4px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}a{color:#94a3b8}</style></head><body>
<h1>Simon</h1><div class="c"><button onclick="start()">Start</button></div>
<div id="s">Watch, then repeat the sequence</div>
<div id="b"><button style="background:#22c55e" onclick="press(0)"></button><button style="background:#ef4444" onclick="press(1)"></button>
<button style="background:#facc15" onclick="press(2)"></button><button style="background:#3b82f6" onclick="press(3)"></button></div>
<a href="/">&larr; back</a>
<script>
var seq=[],pos=0,busy=true,B=document.querySelectorAll('#b button'),ac;
function tone(n){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),v=ac.createGain();
 o.frequency.value=[330,262,392,196][n];v.gain.value=.1;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.25);}catch(e){}}
function lit(n,ms){B[n].className='on';tone(n);setTimeout(function(){B[n].className='';},ms);}
function msg(m){document.getElementById('s').textContent=m;}
function start(){seq=[];next();}
function next(){seq.push(Math.floor(Math.random()*4));pos=0;busy=true;msg('Round '+seq.length);
 seq.forEach(function(n,i){setTimeout(function(){lit(n,400);},600*i+500);});
 setTimeout(function(){busy=false;msg('Your turn');},600*seq.length+500);}
function press(n){if(busy)return;lit(n,200);
 if(n!=seq[pos]){busy=true;msg('Wrong! You reached round '+seq.length+'. Press Start');return;}
 pos++;if(pos==seq.length){busy=true;setTimeout(next,700);}}
</script></body></html>
