<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Whack-a-Mole</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;text-align:center;padding:16px}
h1{font-size:22px;margin:8px 0}#b{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto}
#b button{aspect-ratio:1;border:0;border-radius:50%;background:#3f2a1d;font-size:44px}
#s{min-height:24px;margin:8px}.c button{padding:8px 14px;margin:4px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}a{color:#94a3b8}</style></head><body>
<h1>Whack-a-Mole</h1><div class="c"><button onclick="start()">Start</button></div>
<div id="s">Tap the moles - 30 seconds</div><div id="b"></div><a href="/">&larr; back</a>
<script>
var up=-1,score=0,left=0,tm,clk;
function draw(){var h='';for(var i=0;i<9;i++)h+='<button onclick="hit('+i+')">'+(i==up?'&#128057;':'')+'</button>';document.getElementById('b').innerHTML=h;}
function msg(){document.getElementById('s').textContent='Score: '+score+'   Time: '+left+'s';}
function pop(){var n;do{n=Math.floor(Math.random()*9);}while(n==up);up=n;draw();
 clearTimeout(tm);tm=setTimeout(pop,Math.max(450,1000-score*20));}
function hit(i){if(left<=0||i!=up)return;score++;up=-1;draw();msg();clearTimeout(tm);tm=setTimeout(pop,250);}
function start(){score=0;left=30;msg();clearInterval(clk);pop();
 clk=setInterval(function(){left--;msg();if(left<=0){clearInterval(clk);clearTimeout(tm);up=-1;draw();
  document.getElementById('s').textContent='Time up! Score: '+score;}},1000);}
draw();
</script></body></html>
