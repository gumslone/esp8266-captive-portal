<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Theremin</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;text-align:center;padding:12px;user-select:none;-webkit-user-select:none}
h1{font-size:22px;margin:6px 0}#t{position:relative;height:60vh;max-width:640px;margin:10px auto;border-radius:14px;touch-action:none;overflow:hidden;
background:linear-gradient(to right,#1e1b4b,#581c87,#9d174d,#c2410c)}#t b{position:absolute;width:34px;height:34px;margin:-17px;border-radius:50%;
background:#fff;box-shadow:0 0 24px #fff;display:none;pointer-events:none}#n{font-size:20px;min-height:26px}
.c{margin:6px 0}.c select,.c label{font-size:14px}.c select{padding:6px;border-radius:8px;border:0;background:#2563eb;color:#fff}a{color:#94a3b8}</style></head><body>
<h1>Theremin</h1><div class="c"><select id="w"><option>sine</option><option>triangle</option><option>sawtooth</option><option>square</option></select>
<label><input type="checkbox" id="snap" checked> snap to notes</label></div>
<div id="n">Touch and slide: left/right = pitch, up/down = volume</div><div id="t"><b id="dot"></b></div><a href="/">&larr; back</a>
<script>
var ac,o,g,T=document.getElementById('t'),dot=document.getElementById('dot'),NM=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function start(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();
 o=ac.createOscillator();g=ac.createGain();o.type=document.getElementById('w').value;g.gain.value=0;o.connect(g);g.connect(ac.destination);o.start();}
function move(e){var r=T.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
 var m=45+x*36;if(document.getElementById('snap').checked)m=Math.round(m);   // A2..A5, three octaves
 var f=440*Math.pow(2,(m-69)/12),t=ac.currentTime;o.frequency.setTargetAtTime(f,t,.02);g.gain.setTargetAtTime((1-y)*.4,t,.03);
 dot.style.display='block';dot.style.left=(x*100)+'%';dot.style.top=(y*100)+'%';
 var k=Math.round(m);document.getElementById('n').textContent=NM[k%12]+(Math.floor(k/12)-1)+'  '+Math.round(f)+' Hz';}
function stop(){if(!o)return;var t=ac.currentTime;g.gain.setTargetAtTime(0,t,.05);o.stop(t+.3);o=null;dot.style.display='none';}
T.addEventListener('pointerdown',function(e){e.preventDefault();T.setPointerCapture(e.pointerId);stop();start();move(e);});
T.addEventListener('pointermove',function(e){if(o)move(e);});
T.addEventListener('pointerup',stop);T.addEventListener('pointercancel',stop);
</script></body></html>
