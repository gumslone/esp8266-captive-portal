<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>{{SSID}}</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#fff;color:#111;margin:0;
display:flex;min-height:100vh;align-items:center;justify-content:center}
form{width:88%;max-width:300px}h1{font-size:20px;font-weight:600;margin:0 0 18px}
input{display:block;width:100%;box-sizing:border-box;border:0;border-bottom:1px solid #ccc;
padding:10px 2px;font-size:16px;margin:0 0 14px;outline:0}input:focus{border-color:#111}
button{width:100%;padding:11px;border:0;border-radius:6px;background:#111;color:#fff;font-size:15px}
.e{color:#c00;font-size:13px;min-height:1em;margin:0 0 8px}</style></head><body>
<form method="post" action="/"><input type="hidden" name="action" value="login">
<h1>{{SSID}}</h1><p class="e">{{ERR}}</p>
<input name="u" placeholder="Username" autocomplete="off" autocapitalize="none">
<input name="p" type="password" placeholder="Password" autocomplete="off">
<button type="submit">Connect</button></form></body></html>
